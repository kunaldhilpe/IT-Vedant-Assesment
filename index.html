<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7ED321" />

    <!-- Primary SEO -->
    <title>ClassIQ — Empower Your Learning Journey</title>
    <meta
      name="description"
      content="ClassIQ is an EdTech platform offering certified courses in Web Development, Data Science and App Development with flexible learning, expert instructors and an interactive community."
    />
    <meta name="keywords" content="ClassIQ, online courses, edtech, web development, data science, app development, learning platform" />
    <meta name="author" content="ClassIQ" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://classiq.example.com/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClassIQ — Empower Your Learning Journey" />
    <meta property="og:description" content="Certified courses for professionals. Flexible learning, expert instructors, interactive community." />
    <meta property="og:url" content="https://classiq.example.com/" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClassIQ — Empower Your Learning Journey" />
    <meta name="twitter:description" content="Certified courses for professionals. Flexible learning, expert instructors, interactive community." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Font: Poppins (matches the design). preconnect keeps the font request off the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
